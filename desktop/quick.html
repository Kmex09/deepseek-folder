<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>DSF 快速导入</title>
  <style>
    html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
    body {
      font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      -webkit-user-select: none; user-select: none;
      cursor: default;
    }
    #pill {
      box-sizing: border-box; height: 100vh;
      display: flex; flex-direction: column;
      background: rgba(23, 27, 34, 0.93);
      color: #e7eaf0;
      border: 1px solid rgba(124, 146, 255, 0.5);
      border-radius: 12px;
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.38);
      overflow: hidden;
    }
    /* 顶部拖动条（无边框窗口靠它移动） */
    #bar {
      height: 15px; flex: none;
      -webkit-app-region: drag;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 3px 0 7px;
    }
    #grip { display: flex; gap: 3px; }
    #grip i { display: block; width: 12px; height: 2px; border-radius: 2px; background: rgba(255,255,255,0.26); }
    #close {
      -webkit-app-region: no-drag;
      border: 0; background: transparent; color: rgba(255,255,255,0.55);
      font-size: 11px; line-height: 1; padding: 2px 4px; border-radius: 4px; cursor: pointer;
    }
    #close:hover { background: rgba(255,255,255,0.16); color: #fff; }
    /* 拖放区 */
    #drop {
      flex: 1; -webkit-app-region: no-drag;
      margin: 0 5px 5px;
      border: 1.5px dashed rgba(255,255,255,0.3);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center; gap: 6px;
      font-size: 11.5px; line-height: 1.2;
      color: #c6cbd6; text-align: center; padding: 0 6px;
      transition: border-color 0.12s, background 0.12s, color 0.12s;
    }
    #drop svg { width: 14px; height: 14px; flex: none; }
    #drop.hot { border-color: #7d92ff; background: rgba(77, 107, 254, 0.24); color: #fff; }
    #drop.ok { border-color: #35b07a; background: rgba(53, 176, 122, 0.22); color: #fff; }
  </style>
</head>
<body>
  <div id="pill">
    <div id="bar" title="按住拖动可移动位置">
      <span id="grip"><i></i><i></i><i></i></span>
      <button id="close" title="关闭快速导入窗（可在主界面重新开启）">✕</button>
    </div>
    <div id="drop">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
        <path d="M17 8l-5-5-5 5" />
        <path d="M12 3v12" />
      </svg>
      <span id="tip">拖入链接</span>
    </div>
  </div>

  <!-- 复用网页版同一份链接解析逻辑，保证识别规则一致 -->
  <script src="../js/dsf.utils.js"></script>
  <script src="quick.js"></script>
</body>
</html>
