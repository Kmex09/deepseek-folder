<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <title>DSF · DeepSeek 会话夹</title>
  <meta name="description" content="把 DeepSeek 会话像文件一样分类管理的网页小工具：拖拽导入、文件夹归类、固定常用、找回最近关闭。" />
  <!-- 数据接口会话令牌：由本地服务（server.py / desktop/server.js）在响应时替换。
       file:// 直开时保持占位符不变，此时无后端可连，不影响使用。 -->
  <meta name="dsf-token" content="__DSF_TOKEN__" />
  <link rel="icon" type="image/png" sizes="64x64" href="assets/icon-64.png" />
  <link rel="apple-touch-icon" href="assets/icon-256.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ======================= 图标库（内联 SVG Sprite） ======================= -->
  <svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
    <symbol id="i-spark" viewBox="0 0 24 24"><path fill="currentColor" d="M12 1.5 14.7 7.3 20.5 10 14.7 12.7 12 18.5 9.3 12.7 3.5 10 9.3 7.3Z"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" d="M12 2.5 14.9 8.6 21.5 9.5 16.7 14.1 17.9 20.7 12 17.5 6.1 20.7 7.3 14.1 2.5 9.5 9.1 8.6Z"/></symbol>
    <symbol id="i-star-fill" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2.5 14.9 8.6 21.5 9.5 16.7 14.1 17.9 20.7 12 17.5 6.1 20.7 7.3 14.1 2.5 9.5 9.1 8.6Z"/></symbol>
    <symbol id="i-external" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M15 3h6v6"/><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M10 14 21 3"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M3 6h18"/><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M18 6 6 18M6 6l12 12"/></symbol>
    <symbol id="i-restore" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M1 4v6h6"/><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="1.8"/><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="m21 21-4.3-4.3"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M17 8l-5-5-5 5"/><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M12 3v12"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M7 10l5 5 5-5"/><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M12 15V3"/></symbol>
    <symbol id="i-left" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M19 12H5"/><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M12 19l-7-7 7-7"/></symbol>
    <symbol id="i-right" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M5 12h14"/><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M12 5l7 7-7 7"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="m9 18 6-6-6-6"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M12 7v5l3.5 2"/></symbol>
    <symbol id="i-move" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M5 12h14"/><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="m13 5 7 7-7 7"/></symbol>
    <symbol id="i-panel" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path fill="none" stroke="currentColor" stroke-width="1.8" d="M9.5 4v16"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M12 8h.01M12 11v5"/></symbol>
  </svg>

  <!-- ============================== 应用骨架 ============================== -->
  <div id="app">

    <!-- 左侧边栏（参考 DeepSeek / DSH 原生 UI 的会话列表风格） -->
    <aside id="sidebar">
      <div class="sb-brand">
        <span class="logo"><svg class="ic"><use href="#i-spark"/></svg></span>
        <div class="brand-text">
          <span class="brand-name">DSF</span>
          <span class="brand-sub">DeepSeek 会话夹</span>
        </div>
      </div>

      <div class="sb-search">
        <svg class="ic"><use href="#i-search"/></svg>
        <input id="searchInput" type="search" autocomplete="off"
               placeholder="搜索会话 / 文件夹…" spellcheck="false" />
        <button id="btnClearSearch" class="icon-btn sb-search-clear" hidden title="清除搜索">
          <svg class="ic"><use href="#i-x"/></svg>
        </button>
      </div>

      <button id="btnNewFolder" class="btn primary block">
        <svg class="ic"><use href="#i-plus"/></svg>新建文件夹
      </button>

      <!-- 文件夹导航（树） -->
      <div class="sb-group">
        <div class="sb-group-title">文件夹</div>
        <nav id="folderNav" class="sb-nav" aria-label="文件夹列表"></nav>
      </div>

      <!-- 常用固定 -->
      <div class="sb-group">
        <div class="sb-group-title">常用固定</div>
        <ul id="pinnedList" class="sb-list"></ul>
      </div>

      <!-- 最近关闭 -->
      <div class="sb-group grow">
        <div class="sb-group-title sb-group-title-row">
          <span>最近关闭</span>
          <button id="btnClearRecent" class="mini-btn" hidden>清空</button>
        </div>
        <ul id="recentList" class="sb-list"></ul>
      </div>

      <div class="sb-foot">
        <div class="sb-tools">
          <button id="btnExportBackup" class="mini-btn" title="把全部数据导出为 JSON 备份文件">
            <svg class="ic"><use href="#i-download"/></svg>导出备份
          </button>
          <button id="btnImportBackup" class="mini-btn" title="从 JSON 备份文件恢复数据">
            <svg class="ic"><use href="#i-upload"/></svg>导入备份
          </button>
        </div>
        <div class="sb-stats" id="statText"></div>
        <div id="storageText" class="sb-storage"></div>
        <div id="memWarn" class="sb-warn" hidden>
          <svg class="ic"><use href="#i-info"/></svg>当前浏览器不允许本地存储，数据仅本次会话有效。
          请用启动脚本（server.py）打开以自动保存到数据文件。
        </div>
      </div>
    </aside>

    <!-- 右侧文件管理区（约 3/4 宽） -->
    <main id="main">
      <!-- 导入区 -->
      <div id="importZone" class="import-zone" title="把 DeepSeek 会话按钮或链接拖到这里">
        <svg class="ic"><use href="#i-upload"/></svg>
        <div class="tz-text">
          把 DeepSeek 会话<b>按钮 / 链接</b>拖到这里，即可导入保存
        </div>
        <button id="btnPasteImport" class="btn subtle sm">
          <svg class="ic"><use href="#i-plus"/></svg>粘贴链接导入
        </button>
      </div>

      <!-- file:// 直开模式引导条（默认隐藏，由 app.js 控制） -->
      <div id="modeBanner" class="mode-banner" hidden role="status">
        <svg class="ic"><use href="#i-info"/></svg>
        <span>以文件方式直接打开时，数据只存于浏览器、重启后可能丢失。建议双击
          <b>start-dsf.cmd</b> 启动，数据将自动保存到 dsf-data.json。</span>
        <button type="button" class="icon-btn sm js-hide" title="知道了">
          <svg class="ic ic-sm"><use href="#i-x"/></svg>
        </button>
      </div>

      <header id="mainHeader">
        <button id="btnToggleSidebar" class="icon-btn" title="收起 / 展开侧边栏">
          <svg class="ic"><use href="#i-panel"/></svg>
        </button>
        <nav id="crumbs" class="crumbs" aria-label="面包屑"></nav>
        <div id="viewActions" class="view-actions"></div>
      </header>

      <div id="content" class="content"></div>
    </main>
  </div>

  <div id="modalRoot"></div>
  <div id="toastRoot" class="toast-root" aria-live="polite"></div>

  <noscript><div style="padding:40px;text-align:center">DSF 需要启用 JavaScript 才能运行。</div></noscript>

  <!-- 经典脚本（顺序加载，兼容 file:// 直接打开，无模块依赖） -->
  <script src="js/dsf.utils.js"></script>
  <script src="js/dsf.store.js"></script>
  <script src="js/dsf.ui.js"></script>
  <script src="js/dsf.app.js"></script>
</body>
</html>
